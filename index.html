<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>証言の穴 — サポート</title>
  <style>
:root {
      --bg: #f5f7fa; --card: #ffffff; --text: #222222;
      --muted: #555555; --accent: #2e8b57; --border: #e2e6ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.8; font-size: 17px;
    }
    header { background: var(--accent); color: #fff; padding: 32px 20px; text-align: center; }
    header h1 { margin: 0; font-size: 1.4rem; line-height: 1.5; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }
    section { background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    h2 { font-size: 1.2rem; margin-top: 0; color: var(--accent);
      border-bottom: 2px solid var(--border); padding-bottom: 8px; }
    p { margin: 0 0 12px; }
    a { color: var(--accent); word-break: break-all; }
    .faq-q { font-weight: bold; margin-top: 20px; margin-bottom: 4px; }
    .faq-a { color: var(--muted); margin: 0; }
    .meta { color: var(--muted); font-size: 0.95rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 24px 20px 40px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header><h1>証言の穴</h1></header>
  <main>
    <section>
      <h2>アプリの概要</h2>
      <p>聞き比べて矛盾を見つける推理ゲーム</p>
    </section>
    <section>
      <h2>よくある質問</h2>
      <p class="faq-q">Q. 歩数が表示されません</p>
      <p class="faq-a">A. 端末の「設定」アプリを開き、本アプリに対してモーションとフィットネスの利用を許可してください。</p>
      <p class="faq-q">Q. 機種変更したら記録は引き継がれますか？</p>
      <p class="faq-a">A. 記録はすべて端末内に保存されるため、機種変更時には引き継がれません。</p>
      <p class="faq-q">Q. 購入を復元したい</p>
      <p class="faq-a">A. 設定タブの「購入を復元する」を押してください。</p>
    </section>
    <section>
      <h2>お問い合わせ</h2>
      <p>ご質問・ご要望は下記までご連絡ください。<br>
        <a href="mailto:kk.apps.support@gmail.com">kk.apps.support@gmail.com</a></p>
    </section>
  </main>
  <footer>
    <p><a href="privacy.html">プライバシーポリシー</a></p>
    <p>&copy; 2026 KK Apps</p>
  </footer>
</body>
</html>
